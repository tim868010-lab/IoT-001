<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy System - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Custom styles specific to login page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1e38 50%, #0f172a 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .form-control-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
            color: #f8fafc;
        }
        .form-control-custom::placeholder {
            color: #64748b;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="login-container">
    <div class="card glass-card login-card text-white">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                <i class="fa-solid fa-bolt fa-2x text-warning"></i>
            </div>
            <h3 class="fw-bold mb-1">智慧能耗監控系統</h3>
            <p class="text-muted text-sm">Smart Energy Dashboard</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger text-center py-2" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label text-muted small fw-semibold">帳號 (Email)</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-muted pe-0"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" class="form-control form-control-custom ps-3" id="username" name="username" placeholder="name@school.edu" required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-muted small fw-semibold">密碼</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-muted pe-0"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control form-control-custom ps-3" id="password" name="password" placeholder="請輸入密碼" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom w-100 mb-3">立即登入</button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted small mb-0">預設測試帳密寫於專案 README.md 中</p>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
