<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy Monitoring System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fa-solid fa-bolt text-warning me-2"></i> Smart Energy Dashboard
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="fa-solid fa-chart-line me-1"></i> 即時監控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/repair"><i class="fa-solid fa-tools me-1"></i> 設備報修與履歷</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center">
                    <span class="navbar-text text-light me-3">
                        <span id="live-status" class="badge bg-success shadow-sm pulse-badge me-2">● Live System</span>
                        <i class="fa-regular fa-user text-muted me-1"></i> 
                        <span class="text-white fw-semibold">{{ username }}</span> 
                        <span class="badge bg-secondary text-dark fw-bold ms-1" style="font-size: 0.75rem; background-color: #e2e8f0 !important;">{{ '管理員' if role == 'admin' else '學生' }}</span>
                    </span>
                    <a href="/logout" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-right-from-bracket"></i> 登出</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold mb-0 text-white">Dashboard Overview</h2>
                <p class="text-muted">Real-time power consumption metrics across facilities.</p>
            </div>
        </div>

        <div class="row">
            <!-- Chart Card -->
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0 h-100 glass-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="card-title fw-bold mb-0 text-white"><i class="fa-solid fa-chart-line text-primary me-2"></i> Power Consumption Trend</h5>
                            <button id="refresh-btn" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                        </div>
                        <div class="chart-container" style="position: relative; height:400px; width:100%">
                            <canvas id="energyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats/Logs Card -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0 h-100 glass-card">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold mb-4 text-white"><i class="fa-solid fa-list-ul text-info me-2"></i> Recent Readings</h5>
                        <div class="table-responsive flex-grow-1 custom-scrollbar">
                            <table class="table table-hover table-dark table-borderless text-white mb-0">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Device</th>
                                        <th class="text-end">Usage (kW)</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-table-body">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <!-- Add Chart.js Moment adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
